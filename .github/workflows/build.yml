name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Build Native Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: clockscreen

      - name: Build release binary
        id: build
        shell: bash
        run: |
          cargo build --release --verbose > build.log 2>&1 || {
            echo "## Build Failure Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 150 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -B 2 -E "(error\[|error:)" build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 80 build.log
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Run unit tests
        id: tests
        shell: bash
        run: cargo test --release --bin clockscreen --verbose

      - name: Stage artifact
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\clockscreen.exe dist\clockscreen.exe
          Get-Item dist\clockscreen.exe | Select-Object FullName, Length

      - name: Smoke test (--version)
        id: smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\clockscreen.exe -ArgumentList '--version' -PassThru -Wait
          Write-Output "clockscreen.exe --version exited with $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with code $($process.ExitCode)" }

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: clockscreen-windows-x64
          path: dist/clockscreen.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clockscreen-windows-x64
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" clockscreen.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "ClockScreen $GITHUB_REF_NAME" \
            --notes "Native Windows x64 GPU desktop wallpaper clock, built with anomalyco/rune."
