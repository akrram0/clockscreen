name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Rune sources (patched crates)
        shell: pwsh
        run: ./scripts/fetch-rune.ps1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: clockscreen

      - name: Build release
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Unauthenticated log access, so the failure is readable without a token.
      - name: Publish build log on failure
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build.log
          git commit -m "ci: build log for ${{ github.sha }} [skip ci]"
          git push

      - name: Unit tests
        run: cargo test --release --bin clockscreen

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\clockscreen.exe dist\clockscreen.exe
          Get-Item dist\clockscreen.exe | Select-Object FullName, Length

      - name: Smoke run (no window)
        shell: pwsh
        run: |
          $out = & .\dist\clockscreen.exe --version
          Write-Output "stdout: $out"
          if ($LASTEXITCODE -ne 0) { throw "clockscreen.exe --version exited $LASTEXITCODE" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: clockscreen-windows-x64
          path: dist/clockscreen.exe
          if-no-files-found: error
