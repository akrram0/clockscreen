name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Build Native Windows App (Rune)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Rune sources (pinned vendor crates)
        id: rune
        shell: pwsh
        run: ./scripts/fetch-rune.ps1

      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: clockscreen

      - name: Build release binary
        id: build
        shell: pwsh
        run: |
          cargo build --release --verbose 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests
        id: tests
        shell: pwsh
        run: |
          cargo test --release --bin clockscreen --verbose 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage artifact
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\clockscreen.exe dist\clockscreen.exe
          Get-Item dist\clockscreen.exe | Select-Object FullName, Length

      - name: Smoke test (--version)
        id: smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\clockscreen.exe -ArgumentList '--version' -PassThru -Wait
          Write-Output "clockscreen.exe --version exited with $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with code $($process.ExitCode)" }

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: clockscreen-windows-x64
          path: dist/clockscreen.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clockscreen-windows-x64
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" clockscreen.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "ClockScreen $GITHUB_REF_NAME" \
            --notes "Native Windows x64 GPU desktop wallpaper clock, built with anomalyco/rune."
